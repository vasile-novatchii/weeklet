name: weeklet
description: "Weeklet is a Flutter app for simple personal finance management.
  You can add your weekly expenses for each month, divided into categories such
  as daily expenses, utilities, internet/TV, other, shopping, savings, and car.
  The app automatically calculates weekly and monthly totals, and in the
  statistics section you can see an annual overview—totals by category and total
  income. Ideal for those who want control, clarity, and financial simplicity."
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  collection: ^1.19.1
  equatable: ^2.0.8
  fl_chart: ^1.1.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.0.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  local_auth: ^3.0.1
  package_info_plus: ^10.0.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  share_plus: ^13.0.0
  stream_transform: ^2.1.1
  uuid: ^4.5.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
  flutter_test:
    sdk: flutter
  # hive_generator: ^2.0.1  # conflicts with bloc_test (analyzer version); re-add when regenerating models
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: any
  share_plus_platform_interface: ^7.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icon/
    - assets/fonts/

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icon/icon.png'
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: '#1447E6'
  adaptive_icon_foreground: 'assets/icon/icon.png'

flutter_native_splash:
  color: '#1447E6'
  color_dark: '#101828'
  image: 'assets/icon/icon.png'
  android_12:
    color: '#1447E6'
    color_dark: '#101828'
    image: 'assets/icon/icon.png'
    icon_background_color: '#1447E6'
