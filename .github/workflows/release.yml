name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate tag, pubspec version and branch
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          PUBSPEC_VERSION=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ "${TAG#v}" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag ${TAG#v} does not match pubspec version name '$PUBSPEC_VERSION'"
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit is not reachable from main"
            exit 1
          fi
      - name: Require signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Required secret $name is empty"
              missing=1
            fi
          done
          exit $missing
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: .fvmrc
          cache: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Set up release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          chmod 600 "$KS"
          {
            echo "storeFile=$KS"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          chmod 600 android/key.properties
          keytool -list -keystore "$KS" -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" > /dev/null
      - name: Build split-per-ABI APKs
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/symbols
          ls build/app/outputs/flutter-apk
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" "dist/weeklet-$TAG-$abi.apk"
          done
          count=$(ls dist/*.apk | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "::error::Expected 3 APKs, found $count"
            exit 1
          fi
      - name: Verify APK signer matches release certificate
        shell: bash
        env:
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          EXPECTED=$(keytool -exportcert -alias "$ALIAS" -keystore "$RUNNER_TEMP/release.jks" -storepass "$STOREPASS" | sha256sum | cut -d' ' -f1 | tr 'A-F' 'a-f')
          for apk in dist/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk" > "$RUNNER_TEMP/c.txt"
            if ! grep -qi "certificate SHA-256 digest: $EXPECTED" "$RUNNER_TEMP/c.txt"; then
              echo "::error::$apk is not signed with the release certificate"
              exit 1
            fi
            echo "$apk signer OK: $EXPECTED"
          done
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-symbols-${{ github.ref_name }}
          path: build/symbols
          retention-days: 90
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS --verify-tag --generate-notes --title "$TAG"
      - name: Clean up signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
